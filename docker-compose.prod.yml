services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: jetscope-api
    restart: unless-stopped
    init: true
    mem_reservation: 256m
    mem_limit: 512m
    cpus: "1.0"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JETSCOPE_DATABASE_URL: sqlite:///./data/market.db
      JETSCOPE_ADMIN_TOKEN: ${JETSCOPE_ADMIN_TOKEN}
      JETSCOPE_APP_ENV: production
      JETSCOPE_MARKET_REFRESH_INTERVAL_SECONDS: "600"
      JETSCOPE_SQLITE_PATH: ./data/market.db
    volumes:
      - ./data:/app/data

  web:
    build:
      # Repository root, not apps/web: npm workspaces keep the lockfile and the
      # hoisted node_modules here, and packages/core is reached by path alias.
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jetscope-web
    restart: unless-stopped
    init: true
    depends_on:
      - api
    mem_reservation: 256m
    mem_limit: 512m
    cpus: "1.0"
    environment:
      NODE_ENV: production
      # Not optional. An empty base is correct for a browser calling a
      # same-origin nginx, but every page in this app is `force-dynamic` and
      # fetches on the server, where there is no origin to be relative to.
      # Without this the site still renders 200 on every route - with every
      # read model on its fallback, reporting invented constants. See
      # docs/DEPLOY_WEB_VPS.md.
      JETSCOPE_API_BASE_URL: http://api:8000
      JETSCOPE_API_PREFIX: /v1
    # Bound to loopback: nginx reaches it over the compose network. Published
    # only so the post-deploy check can curl it directly on the host.
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: jetscope-nginx
    restart: unless-stopped
    init: true
    depends_on:
      - web
      - api
    mem_reservation: 32m
    mem_limit: 128m
    cpus: "0.5"
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Operator-supplied TLS server blocks. The directory may be empty; the
      # include in nginx.prod.conf globs and matches nothing until it is not.
      - ./infra/tls:/etc/nginx/tls:ro
    ports:
      - "80:80"
      - "443:443"
