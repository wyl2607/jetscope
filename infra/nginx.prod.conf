# Production edge for the VPS. Mounted at /etc/nginx/conf.d/default.conf by the
# `nginx` service in docker-compose.prod.yml.
#
# `infra/nginx.conf` and `infra/app.conf` serve the dev compose and are NOT
# reused here. One difference matters: app.conf ends with a regex location
#
#     location ~* \.(js|css|png|...)$ { expires 1y; }
#
# that carries no `proxy_pass`. A regex location wins over a prefix location in
# nginx, so in this topology it would intercept every Next.js asset and try to
# serve it off nginx's own disk, where it does not exist. Static caching below
# is done with a prefix location that still proxies.
#
# Security headers and edge Cache-Control are explicit on every location that
# sets any header. nginx `add_header` does not merge with the server block: a
# location that only set Cache-Control would silently drop HSTS and friends.
# Keep this file's security header set identical to infra/server/nginx.conf.

upstream jetscope_web {
    server web:3000;
    keepalive 16;
}

upstream jetscope_api {
    server api:8000;
    keepalive 16;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    # No `listen [::]:80` here. On a host with IPv6 disabled, nginx fails to
    # bind it and refuses to start entirely, taking down IPv4 service too. Add
    # it in infra/tls/ alongside the 443 block once the host is known to have
    # IPv6.
    server_name _;

    # Server-rendered HTML can be large and is never cached by the browser.
    client_max_body_size 2m;

    # Baseline security headers (P4 must not ship without these — host nginx
    # already has them; cutover without this block would drop the five headers).
    # Any location that adds its own add_header must restate the full set.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- API -------------------------------------------------------------
    # Declared before the catch-all. If `/` were matched first, the browser
    # would receive an HTML error page where it expected JSON, and the read
    # models would fall back silently rather than reporting a failure.

    # `/v1/` is a prefix match, so bare `/v1` does not match it and would fall
    # through to the catch-all and be answered by Next with HTML. An exact
    # match catches it. This is the same silent-fallback failure in miniature:
    # the caller gets a 200 carrying the wrong content type.
    # Never shared-cache API responses (live data; may see operator tokens).
    location = /v1 {
        proxy_pass http://jetscope_api/v1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /v1/ {
        proxy_pass http://jetscope_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Next.js BFF under /api/ -----------------------------------------
    # Must not inherit the public-page s-maxage on `/`. private, no-store.
    location ^~ /api/ {
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Next.js build assets --------------------------------------------
    # Content-hashed, so they are immutable. Prefix location, not regex: see
    # the note at the top of this file. Full security header set restated
    # because this location has its own add_header (inheritance would drop it).
    location /_next/static/ {
        proxy_pass http://jetscope_web/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Admin UI: edge Basic Auth (layer 1) ------------------------------
    # Application write routes still require x-admin-token (layer 2).
    # Credential file is operator state: never commit hashes or passwords.
    # Mount the file at the path below (e.g. docker secret / host bind).
    # Exact + trailing-slash prefixes avoid matching paths like /administrator.
    # Not cacheable: authenticated operational surface.
    location = /admin {
        auth_basic "JetScope admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /admin/ {
        auth_basic "JetScope admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /de/admin {
        auth_basic "JetScope admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /de/admin/ {
        auth_basic "JetScope admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /en/admin {
        auth_basic "JetScope admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /en/admin/ {
        auth_basic "JetScope admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Everything else: public SSR pages --------------------------------
    # Short s-maxage for anonymous HTML. See docs/DEPLOY_USA_VPS.md for the
    # cacheability classification (no per-visitor cookies; path-based locales;
    # shared workspace data only).
    location / {
        proxy_pass http://jetscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;

        # Every page is `dynamic = 'force-dynamic'` and fetches from the API on
        # the server, so one request here can cost a full round trip to the API
        # plus render. This must stay above the app's own fetch timeouts
        # (JETSCOPE_*_FETCH_TIMEOUT_MS) or nginx gives up first and the reader
        # gets a 504 instead of the app's own degraded-but-honest page.
        proxy_read_timeout 60s;

        # Replace Next's force-dynamic no-store so shared edges can apply s-maxage.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=300" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}

# --- TLS ---------------------------------------------------------------------
# Certificates are operator state and are deliberately not in this repository.
# There is no `ssl_certificate` line above on purpose: nginx refuses to start if
# it points at a file that is not there, which would take the whole site down on
# a fresh host rather than serving it over HTTP.
#
# To enable TLS, drop a server block on the host at
#
#     infra/tls/<name>.conf        (mounted read-only at /etc/nginx/tls/)
#
# containing the 443 listener, the certificate paths, and a redirect from 80.
# The glob below matches nothing until you do, which is a valid include.
include /etc/nginx/tls/*.conf;
