# JetScope usa edge -> oci-a1 upstreams (http level).
# Install as /etc/nginx/conf.d/jetscope-upstream.conf.
#
# Two placeholders are replaced at install time (see README.md): the plain
# address placeholder becomes the oci-a1 tailnet address 100.81.227.79, and
# the regex placeholder becomes its dot-escaped form 100\.81\.227\.79 for the
# map below.
#
# The 4s keepalive timeout stays below the 5s idle timeout of both backends
# (uvicorn and Node), so nginx never reuses a connection the backend has
# already closed. Upstream-block keepalive_timeout needs nginx >= 1.15.3;
# usa-vps runs 1.24.

upstream jetscope_api {
    server __OCI_IP__:8000 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:8000 backup;
    keepalive 8;
    keepalive_timeout 4s;
}

upstream jetscope_web {
    server __OCI_IP__:3000 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3000 backup;
    keepalive 8;
    keepalive_timeout 4s;
}

upstream jetscope_api_rw {
    server __OCI_IP__:8000 max_fails=2 fail_timeout=30s;
    keepalive 8;
    keepalive_timeout 4s;
}

upstream jetscope_web_rw {
    server __OCI_IP__:3000 max_fails=2 fail_timeout=30s;
    keepalive 8;
    keepalive_timeout 4s;
}

map $request_method $jetscope_api_up {
    GET jetscope_api;
    HEAD jetscope_api;
    OPTIONS jetscope_api;
    default jetscope_api_rw;
}

map $request_method $jetscope_web_up {
    GET jetscope_web;
    HEAD jetscope_web;
    OPTIONS jetscope_web;
    default jetscope_web_rw;
}

# $upstream_addr is a comma-separated list when a request was retried; the
# address that actually served the request is the last one, so anchor on the
# end of the string instead of the start.
map $upstream_addr $jetscope_served_by {
    default none;
    "~__OCI_IP_RE__:[0-9]+$" oci-a1;
    "~127\.0\.0\.1:[0-9]+$" usa;
}
