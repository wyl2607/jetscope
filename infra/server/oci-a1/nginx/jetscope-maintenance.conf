# JetScope cutover gate. Install as
# /etc/nginx/snippets/jetscope-maintenance.conf only while a cutover is in
# progress. site.conf includes the glob
# /etc/nginx/snippets/jetscope-maintenance*.conf; a glob with no match is not
# an error, so removing this file lifts the gate.
#
# Reads pass through; writes get 503 with Retry-After. This snippet is included
# in the server context, so it runs before location matching.
add_header Retry-After 120 always;

if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 503;
}
